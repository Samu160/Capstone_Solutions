<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Triad Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --navy: #0d1f35;
            --navy-light: #1f3d5c;
            --gold: #c8903a;
            --gold-light: #e0a94a;
        }
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(150deg, var(--navy) 0%, var(--navy-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 3.5rem 3rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
        }
        .check {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.75rem;
            font-size: 2rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(200,144,58,.4);
            animation: popIn .5s cubic-bezier(.36,1.56,.64,1) both;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-family: 'Cinzel', Georgia, serif;
            color: var(--navy);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #5a6a7e;
            line-height: 1.75;
            margin-bottom: .75rem;
        }
        strong { color: var(--navy); }
        .actions {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            margin-top: 2.25rem;
        }
        .btn {
            padding: .85rem 1.5rem;
            border-radius: 32px;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: .9rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all .22s ease;
        }
        .btn-primary {
            background: var(--gold);
            color: #fff;
            box-shadow: 0 4px 18px rgba(200,144,58,.35);
        }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); }
        .btn-ghost {
            background: transparent;
            color: var(--navy);
            border: 1.5px solid #d0d9e4;
        }
        .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>
    <div class="card" role="main">
        <div class="check" aria-hidden="true">✓</div>
        <h1>Thank You!</h1>
        <p>Your form has been successfully received.</p>
        <p>A member of our team will contact you within <strong>3–5 business days</strong>.</p>
        <p>In the meantime, feel free to reach out at <strong>info@triadenergy.com</strong>.</p>
        <div class="actions">
            <a href="index.html" class="btn btn-primary">Return to Home</a>
            <a href="intakeform.html" class="btn btn-ghost">Submit Another Form</a>
        </div>
    </div>
</body>
</html>
